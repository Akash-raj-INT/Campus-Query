<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CampusQuery</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Serif:wght@500;700&display=swap');

        :root {
            --bg-1: #0f172a;
            --bg-2: #172554;
            --surface: #ffffff;
            --text: #0b1020;
            --muted: #5b6477;
            --line: #d6def0;
            --accent: #f59e0b;
            --accent-2: #14b8a6;
            --accent-3: #3b82f6;
            --radius: 14px;
            --shadow: 0 16px 40px rgba(15, 23, 42, 0.2);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--text);
            font-family: "Space Grotesk", "Trebuchet MS", sans-serif;
            background:
                radial-gradient(circle at 10% 0%, rgba(245, 158, 11, 0.35), transparent 36%),
                radial-gradient(circle at 90% 8%, rgba(20, 184, 166, 0.3), transparent 42%),
                linear-gradient(135deg, var(--bg-1), var(--bg-2) 55%, #1d4ed8);
            background-attachment: fixed;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.22;
            background-image: linear-gradient(to right, #ffffff 1px, transparent 1px),
                              linear-gradient(to bottom, #ffffff 1px, transparent 1px);
            background-size: 44px 44px;
        }

        .site-shell {
            position: relative;
            z-index: 1;
            max-width: 1140px;
            margin: 0 auto;
            padding: 22px 16px 30px;
        }

        .topbar {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.23);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            padding: 14px 14px 10px;
            color: #fff;
            box-shadow: 0 12px 28px rgba(10, 20, 50, 0.25);
        }

        .topbar-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .brand {
            font-family: "IBM Plex Serif", Georgia, serif;
            font-size: 1.3rem;
            letter-spacing: 0.3px;
            margin: 0;
        }

        .brand small {
            font-family: "Space Grotesk", sans-serif;
            color: rgba(255, 255, 255, 0.82);
            font-size: 0.74rem;
            margin-left: 8px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .menu-toggle {
            border: 1px solid rgba(255, 255, 255, 0.45);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border-radius: 10px;
            width: auto;
            margin: 0;
            padding: 8px 10px;
            display: none;
        }

        .nav {
            margin-top: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .nav a {
            text-decoration: none;
            color: #fff;
            font-size: 0.9rem;
            padding: 8px 11px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.08);
            transition: transform 140ms ease, border-color 140ms ease, background 140ms ease;
        }

        .nav a:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.55);
            background: rgba(255, 255, 255, 0.17);
        }

        .surface {
            margin-top: 16px;
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid rgba(255, 255, 255, 0.35);
            box-shadow: var(--shadow);
            border-radius: 18px;
            padding: 22px;
        }

        h1, h2, h3 {
            margin: 0 0 12px;
            line-height: 1.15;
            font-family: "IBM Plex Serif", Georgia, serif;
        }

        p {
            margin-top: 0;
        }

        .muted {
            color: var(--muted);
        }

        .hero {
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 14px;
            background:
                radial-gradient(circle at 90% 0%, rgba(59, 130, 246, 0.14), transparent 48%),
                radial-gradient(circle at 0% 100%, rgba(20, 184, 166, 0.14), transparent 45%),
                #f9fbff;
            margin-bottom: 18px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
        }

        .action-card {
            display: block;
            text-decoration: none;
            border: 1px solid #c8d3ef;
            border-radius: var(--radius);
            padding: 14px;
            background: #fff;
            transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
            color: var(--text);
        }

        .action-card:hover {
            transform: translateY(-2px);
            border-color: #93c5fd;
            box-shadow: 0 10px 22px rgba(30, 58, 138, 0.15);
        }

        #localFilter {
            width: 100%;
            max-width: 640px;
            margin-top: 8px;
            margin-bottom: 18px;
            border: 1px solid #c8d3ef;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 0.95rem;
        }

        .stack > * + * {
            margin-top: 10px;
        }

        .card {
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 14px;
            background: #fff;
            transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
        }

        .card:hover {
            transform: translateY(-3px);
            border-color: #bcc9ea;
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
        }

        .row-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            color: var(--muted);
            font-size: 0.82rem;
        }

        .pill {
            display: inline-block;
            border-radius: 999px;
            background: #eff6ff;
            color: #1e3a8a;
            border: 1px solid #bfdbfe;
            font-size: 0.74rem;
            padding: 3px 9px;
        }

        form {
            margin: 0;
        }

        form p {
            margin: 0 0 12px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }

        input, textarea, select, button {
            width: 100%;
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: "Space Grotesk", sans-serif;
            border: 1px solid #c8d3ef;
            padding: 10px 12px;
            margin: 0;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #60a5fa;
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.2);
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            width: auto;
            cursor: pointer;
            border: 0;
            background: linear-gradient(90deg, var(--accent-3), #1d4ed8);
            color: #fff;
            box-shadow: 0 6px 14px rgba(37, 99, 235, 0.35);
            transition: transform 150ms ease, filter 150ms ease;
        }

        .btn:hover {
            transform: translateY(-1px);
            filter: brightness(1.04);
        }

        .btn-secondary {
            background: linear-gradient(90deg, var(--accent-2), #0f766e);
            box-shadow: 0 6px 14px rgba(15, 118, 110, 0.3);
        }

        .btn-ghost {
            width: auto;
            background: #fff;
            border: 1px solid var(--line);
            color: #1e3a8a;
            box-shadow: none;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
        }

        a {
            color: #1d4ed8;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .empty {
            border: 1px dashed #bfcbef;
            border-radius: var(--radius);
            background: #f8fbff;
            color: var(--muted);
            padding: 14px;
        }

        .reveal {
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 380ms ease, transform 380ms ease;
        }

        .reveal.in-view {
            opacity: 1;
            transform: none;
        }

        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        @media (max-width: 820px) {
            .menu-toggle {
                display: inline-block;
            }

            .nav {
                display: none;
            }

            .nav.open {
                display: flex;
            }

            .grid-2 {
                grid-template-columns: 1fr;
            }

            .surface {
                padding: 16px;
            }
        }
    </style>
</head>
<body>
<div class="site-shell">
    <header class="topbar">
        <div class="topbar-row">
            <h1 class="brand">CampusQuery <small>Community Knowledge</small></h1>
            <button type="button" class="menu-toggle" id="menuToggle">Menu</button>
        </div>
        <nav class="nav" id="siteNav">
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'notes_list' %}">Notes</a>
            <a href="{% url 'ask_question' %}">Q&A</a>
            <a href="{% url 'mentor_matching' %}">Mentors</a>
            <a href="{% url 'search' %}?q=">Search</a>
            {% if user.is_authenticated %}
                <a href="{% url 'mentor_profile' %}">My Mentor Profile</a>
                <a href="{% url 'logout' %}">Logout</a>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
                <a href="{% url 'signup' %}">Sign Up</a>
            {% endif %}
        </nav>
    </header>

    <main class="surface">
        {% block content %}{% endblock %}
    </main>
</div>

<script>
    (function () {
        const toggle = document.getElementById("menuToggle");
        const nav = document.getElementById("siteNav");
        if (toggle && nav) {
            toggle.addEventListener("click", function () {
                nav.classList.toggle("open");
            });
        }

        const observer = new IntersectionObserver(function (entries) {
            entries.forEach(function (entry) {
                if (entry.isIntersecting) {
                    entry.target.classList.add("in-view");
                }
            });
        }, { threshold: 0.08 });

        document.querySelectorAll(".reveal").forEach(function (el) {
            observer.observe(el);
        });

        const filterInput = document.querySelector("[data-live-filter]");
        if (filterInput) {
            const targetSelector = filterInput.getAttribute("data-live-filter");
            const items = Array.prototype.slice.call(document.querySelectorAll(targetSelector || ""));
            filterInput.addEventListener("input", function () {
                const q = filterInput.value.trim().toLowerCase();
                items.forEach(function (item) {
                    const text = item.textContent.toLowerCase();
                    item.style.display = text.includes(q) ? "" : "none";
                });
            });
        }

        const localFilter = document.getElementById('localFilter');
        if (localFilter) {
            localFilter.addEventListener('input', function () {
                const query = localFilter.value.trim().toLowerCase();
                const items = document.querySelectorAll('.grid-2 .card');
                if (!query) {
                    items.forEach(i => i.style.display = '');
                    return;
                }
                items.forEach(function (item) {
                    const text = item.textContent.toLowerCase();
                    item.style.display = text.includes(query) ? '' : 'none';
                });
            });
        }
    })();
</script>
</body>
</html>
