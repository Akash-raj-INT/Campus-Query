{% extends 'base.html' %}

{% block content %}
<section class="hero reveal">
    <h2>Login</h2>
    <p class="muted">Welcome back. Continue your CampusQuery activity.</p>
</section>

<section class="reveal">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <fieldset>
            <legend>Login as</legend>
            <label>
                <input type="radio" name="role" value="student" checked>
                Student
            </label>
            <label>
                <input type="radio" name="role" value="teacher">
                Teacher
            </label>
        </fieldset>

        <div class="actions">
            <button type="submit" class="btn">Login</button>
            <a href="{% url 'signup' %}" class="btn-ghost">Create Account</a>
        </div>
    </form>
</section>
{% endblock %}
